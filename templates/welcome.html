{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Crush HR - Không Gian Quản Trị</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            btnLight: '#cc5b73',
                            btnDark: '#b9465f',
                            btnShadow: 'rgba(190, 77, 102, 0.45)',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'float': 'floating 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        floating: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat relative overflow-hidden"
      style="background-image: url('https://res.cloudinary.com/vlytnbnw/image/upload/v1794044466/Banner_welcome_v2.png');">

    <main class="absolute left-[10%] w-full lg:w-1/2 flex justify-center top-[80%] sm:top-[70%] opacity-0 animate-fade-in delay-200 px-4">

        {% if user.is_authenticated %}
            {% if user.is_staff or user.is_superuser %}
                <a href="{% url 'trang_quan_ly' %}"
                   class="animate-float group inline-flex items-center justify-center gap-3 bg-gradient-to-r from-brand-btnLight to-brand-btnDark text-white text-[15px] font-bold py-3.5 px-10 rounded-full shadow-[0_12px_25px_var(--tw-shadow-color)] shadow-brand-btnShadow hover:shadow-[0_15px_30px_var(--tw-shadow-color)] hover:-translate-y-1 transition-all duration-300">
                    Vào Không gian Quản Lý
                    <i class="fa-solid fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1"></i>
                </a>
            {% else %}
                <a href="{% url 'trang_nhan_vien' %}"
                   class="animate-float group inline-flex items-center justify-center gap-3 bg-gradient-to-r from-brand-btnLight to-brand-btnDark text-white text-[15px] font-bold py-3.5 px-10 rounded-full shadow-[0_12px_25px_var(--tw-shadow-color)] shadow-brand-btnShadow hover:shadow-[0_15px_30px_var(--tw-shadow-color)] hover:-translate-y-1 transition-all duration-300">
                    Vào Không gian Làm Việc
                    <i class="fa-solid fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1"></i>
                </a>
            {% endif %}
        {% else %}
            <!-- Nút Đăng nhập -->
            <a href="{% url 'login' %}"
               class="animate-float group inline-flex items-center justify-center gap-3 bg-gradient-to-r from-brand-btnLight to-brand-btnDark text-white text-[15px] font-bold py-3.5 px-10 rounded-full shadow-[0_12px_25px_var(--tw-shadow-color)] shadow-brand-btnShadow hover:shadow-[0_15px_30px_var(--tw-shadow-color)] hover:-translate-y-1 transition-all duration-300">
                Đăng nhập
                <i class="fa-solid fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1"></i>
            </a>
        {% endif %}

    </main>

</body>
</html>
